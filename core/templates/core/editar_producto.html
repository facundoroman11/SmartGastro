<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGastro - Editar Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex items-center justify-center py-12 px-4">
    <div class="max-w-lg w-full bg-white rounded-lg shadow-md overflow-hidden">
        <div class="bg-blue-600 px-6 py-4 flex justify-between items-center">
            <h2 class="text-lg font-semibold text-white">Editar Producto</h2>
            <a href="{% url 'inventario' %}" class="text-xs text-blue-100 hover:text-white underline">Volver al Inventario</a>
        </div>
        <form method="POST" class="p-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nombre</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Cantidad</label>
                    <input type="number" step="0.01" name="cantidad" value="{{ producto.cantidad|stringformat:'.2f' }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Unidad</label>
                    <input type="text" name="unidad_medida" value="{{ producto.unidad_medida }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Precio Unitario ($)</label>
                    <input type="number" step="0.01" name="precio_unitario" value="{{ producto.precio_unitario|stringformat:'.2f' }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Stock Mínimo</label>
                    <input type="number" step="0.01" name="stock_minimo" value="{{ producto.stock_minimo|stringformat:'.2f' }}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="pt-4 flex gap-3">
                <a href="{% url 'inventario' %}" class="w-1/2 text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 rounded-md transition duration-200">
                    Cancelar
                </a>
                <button type="submit" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition duration-200">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</body>
</html>
